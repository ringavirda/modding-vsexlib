name: Tests (legacy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Legacy pipeline: runs the test suite against the OLDER supported game versions, opt-in via
# -p:Legacy=true against each version's target framework. Kept separate from the primary Tests
# workflow so the current-version build and the legacy builds report as independent checks.
#
# Each matrix entry provisions the matching freely-downloadable dedicated-server archive into
# .game/<slug> - the in-repo location the build reads for $(GamePath) and the headless test harness
# resolves assemblies from at runtime. No coverage gate here - the gate floors track the current
# build (see tests.yml).
#
# Adding a game version means a row HERE, in the build/ExpandedLib.props manifest (CI YAML can't
# read MSBuild), in $GameTfms in extools' exmod.ps1, and in extools' pack/Program.cs GameTargets.

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.game }} (${{ matrix.tfm }})
    strategy:
      fail-fast: false
      # The .0 of each legacy series - the floor the mods stay source-compatible with. Keep in sync
      # with the manifest in build/ExpandedLib.props.
      matrix:
        include:
          - game: "1.21.0"
            series: "1.21"
            tfm: net8.0
          - game: "1.20.0"
            series: "1.20"
            tfm: net7.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Every tag: the release-seed guard compares against the newest v<x.y.z>.
          fetch-depth: 0

      # exmod.json's "docs" entry reads ../exdocs; a checkout stays inside the workspace, so the
      # sibling is a link to it.
      - name: Checkout exdocs
        uses: actions/checkout@v4
        with:
          repository: ringavirda/exdocs
          ref: ${{ github.base_ref || github.ref_name }}
          ssh-key: ${{ secrets.EXDOCS_KEY }}
          path: .exdocs
          sparse-checkout: exlib

      - name: Place exdocs beside the repository
        run: ln -s "$GITHUB_WORKSPACE/.exdocs" "$GITHUB_WORKSPACE/../exdocs"

      # The legacy test host runs on the matching runtime, so install all SDKs the suite targets.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            10.0.x

      - name: Cache Vintage Story install
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: .game
          key: vs-game-${{ matrix.game }}

      - name: Provision Vintage Story (server assemblies)
        run: bash scripts/exmod.sh provision game -Version "${{ matrix.game }}" -Kind server

      # The last green test count per assembly, which the test step compares against and rewrites
      # when it passes; one cache per branch and series, the newest run's copy restored.
      - name: Restore .exmod/census/
        uses: actions/cache/restore@v4
        with:
          path: .exmod/census/
          key: census-${{ github.head_ref || github.ref_name }}-${{ matrix.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: census-${{ github.head_ref || github.ref_name }}-${{ matrix.series }}-

      # The same command a contributor runs locally. It knows which projects exist for a legacy
      # series (the sample and the standalone tool target the current one only), builds them serially
      # and runs the lanes in parallel with a per-lane summary.
      - name: Test (legacy ${{ matrix.tfm }})
        run: bash scripts/exmod.sh test ${{ matrix.series }}

      - name: Save .exmod/census/
        if: hashFiles('.exmod/census/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .exmod/census/
          key: census-${{ github.head_ref || github.ref_name }}-${{ matrix.series }}-${{ github.run_id }}-${{ github.run_attempt }}
