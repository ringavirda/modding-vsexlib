name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vs_version:
        description: "Vintage Story version (full patch, or major.minor for the latest patch)"
        required: false
        default: "1.22"

# Primary pipeline: builds + tests the mods against the CURRENT game version (the non-legacy
# target), with coverage and the coverage gate. The older game versions are covered by a separate
# workflow (tests-legacy.yml) so the two run as independent checks.
#
# The build references the game assemblies (VintagestoryAPI.dll, VSSurvivalMod.dll, VSEssentials.dll
# and the Lib/*.dll), and the headless test harness resolves them at runtime. scripts/exmod.sh
# fetches the freely-downloadable dedicated-server archive (which carries those assemblies) into
# .game/<slug> - the same in-repo location the build/resolver default to - so no env var, game install
# or licence is needed.
env:
  # Primary tracks the latest patch of the current series (legacy pins .0 - see tests-legacy.yml).
  VS_VERSION: ${{ github.event.inputs.vs_version || '1.22.7' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story install
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: .game
          key: vs-game-${{ env.VS_VERSION }}

      - name: Provision Vintage Story (server assemblies)
        run: bash scripts/exmod.sh provision game -Version "$VS_VERSION" -Kind server

      - name: Restore
        run: dotnet restore ExpandedLib.sln

      # Collects cobertura over the solution and ratchets it against tests/coverage-floors.json.
      # The same command a contributor runs locally, so the gate cannot drift from what CI enforces.
      - name: Run tests with coverage
        run: bash scripts/exmod.sh test -Coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  smoke:
    needs: test
    runs-on: ubuntu-latest

    # A separate job runs on its own fresh checkout with none of `test`'s build output, so `exmod
    # smoke` builds whatever mod isn't already built (see Invoke-Smoke in extools' exmod/run.ps1).
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story install
        uses: actions/cache@v4
        with:
          path: .game
          key: vs-game-${{ env.VS_VERSION }}

      - name: Smoke-test the dedicated server boot
        run: bash scripts/exmod.sh smoke -Version "$VS_VERSION"

  scaffold:
    name: Starter and templates
    needs: test
    runs-on: ubuntu-latest

    # Packs exlib's own packages (including the templates) into a local feed, generates the starter
    # from exlib's manifest, scaffolds every kind into it, then builds and tests it - the same
    # commands a fresh clone's README walks a modder through.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story install
        uses: actions/cache@v4
        with:
          path: .game
          key: vs-game-${{ env.VS_VERSION }}

      - name: Provision Vintage Story (server assemblies)
        run: bash scripts/exmod.sh provision game -Version "$VS_VERSION" -Kind server

      - name: Pack into a local feed
        run: bash scripts/exmod.sh nuget

      - name: Generate the starter, scaffold every kind, build and test it
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/pkgs
        run: |
          set -euo pipefail
          # Reuse the game already provisioned above instead of setup's own provisioning: setup
          # also fetches exlib's dependency mods for this unreleased version, which 404s (the
          # release this job would resolve against is cut only after main goes green from this
          # very run). The slug matches Invoke-ProvisionGame's own major.minor rule; VS_VERSION is
          # a full patch, so this is never the client-conflict "-server" suffix a workstation with
          # a pre-existing client would get.
          slug=$(echo "$VS_VERSION" | cut -d. -f1,2)
          export VINTAGE_STORY="$GITHUB_WORKSPACE/.game/$slug"
          version=$(jq -r .version src/ExpandedLib/modinfo.json)
          dest="$RUNNER_TEMP/starter"
          # The generator commits the starter it writes; a runner has no git identity of its own.
          git config --global user.name "exmod"
          git config --global user.email "exmod@users.noreply.github.com"
          bash scripts/exmod.sh starter "$dest" -ExlibRoot "$GITHUB_WORKSPACE" -Version "$version"
          cd "$dest"
          dotnet new nugetconfig
          dotnet nuget add source "$GITHUB_WORKSPACE/dist/nuget" --name exlib-local --configfile nuget.config
          bash scripts/exmod.sh new demo
          for k in block item recipe megablock multiblock node blockbehavior entitybehavior config migration command; do
            bash scripts/exmod.sh scaffold "$k" "Demo${k^}" -Mod demo
          done
          # demo's own test project carries no golden-completeness check, so the scaffolded
          # block/item/recipe/megablock/multiblock/node kinds (each a code-first def) would land
          # unproven against that seam. Rendering the exlib-tests template's GoldenTests.cs into
          # demo exercises it for real: the scaffolded defs' goldens are blessed once and
          # re-checked, so every kind's def emitter is exercised and the golden set is proven to
          # cover it.
          dotnet new install "$GITHUB_WORKSPACE/templates/content/exlib-tests" --force
          goldenTmp=$(mktemp -d)
          dotnet new exlib-tests -n Demo.Tests --ModName demo -o "$goldenTmp" --force
          mkdir -p mods/demo/tests/Definitions
          cp "$goldenTmp/Definitions/GoldenTests.cs" mods/demo/tests/Definitions/GoldenTests.cs
          bash scripts/exmod.sh build latest
          EXLIB_WRITE_GOLDENS=1 bash scripts/exmod.sh test latest
          bash scripts/exmod.sh test latest
