name: Sync Wiki

# Publishes the wiki sources in exdocs (exlib/wiki in ringavirda/exdocs) to this repository's GitHub
# wiki (the separate <repo>.wiki.git). exdocs is the single source of truth; the wiki is a generated
# mirror, so never edit the wiki directly (those edits would be overwritten on the next sync). The
# nightly run carries an exdocs edit that no push here triggered.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

# A single in-flight sync at a time; newer pushes supersede older ones.
concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    # A private repository has no wiki to publish to; the job is skipped, not failed.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exdocs
        uses: actions/checkout@v4
        with:
          repository: ringavirda/exdocs
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.EXDOCS_KEY }}
          path: exdocs
          sparse-checkout: exlib/wiki

      - name: Publish exdocs/exlib/wiki to the GitHub wiki
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          # The wiki's git repository exists only once its first page has been created in the
          # GitHub UI; until then there is nothing to publish to, and that is not a failure.
          if ! git ls-remote --exit-code "$wiki_url" HEAD >/dev/null 2>&1; then
            echo "No wiki repository yet: create the first wiki page in the GitHub UI, then re-run."
            exit 0
          fi

          git clone "$wiki_url" wiki-repo
          # Replace the wiki contents with the exdocs sources (keep the wiki's .git).
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R exdocs/exlib/wiki/. wiki-repo/

          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from exdocs $(git -C ../exdocs rev-parse --short HEAD)"
            git push
          fi
